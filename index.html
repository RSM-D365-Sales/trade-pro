<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Promotion Management · Bluestem Fresh Produce</title>
    <meta
      name="description"
      content="Bluestem Fresh Produce Trade Promotion Management — plan it, fund it, match it. Calendar-cool."
    />
    <meta name="theme-color" content="#00153D" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon_64.png" />
    <link rel="apple-touch-icon" href="/brand/bluestem_icon_blue.png" />
    <script>
      // Set theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bstpm.theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
