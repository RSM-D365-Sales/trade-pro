name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the same checks that run locally. A broken demo is
      # worse than a stale one — this is the URL that goes in front of prospects.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Serves from https://<domain>/trade-pro/ — vite.config.ts reads this
          # and the router uses basename={import.meta.env.BASE_URL}.
          BASE_PATH: /trade-pro/

# GitHub Pages has no SPA rewrite rules, so any path that isn't a real file
      # 404s. Two layers handle that:
      #
      # 1. Pre-render each STATIC route as a real directory + index.html, so
      #    /trade-pro/deductions returns a genuine HTTP 200. This matters
      #    beyond aesthetics — a 404 status breaks link unfurling in Outlook
      #    and Teams, which is exactly how a demo link gets shared.
      # 2. 404.html as a copy of index.html catches everything else, notably
      #    dynamic routes like /promotions/<id>. The app still boots and the
      #    router resolves the path; only the status line is wrong.
      - name: Pre-render static routes + SPA fallback
        run: |
          for route in deductions promotions calendar forecast funds analytics settings; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
          echo "Pre-rendered:" && find dist -name index.html | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
